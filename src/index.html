<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Panel Administrador</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<link
			rel="preload"
			as="style"
			href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=block"
		/>

		<link
			href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=block"
			rel="stylesheet"
		/>
		<link href="plugins/global/plugins.bundle.css" rel="stylesheet" type="text/css" />
		<link href="css/style.bundle.css" rel="stylesheet" type="text/css" />
		<link rel="stylesheet" href="css/theme.css" />
		<link rel="stylesheet" href="css/page-header.css" />
		<link rel="stylesheet" href="css/select.css" />
		<link rel="stylesheet" href="css/dropdown.css" />
		<link rel="stylesheet" href="/css/table.css" />
		<link rel="stylesheet" href="/css/validation.css" />
		<link rel="stylesheet" href="/css/list-toolbar.css" />
		<link rel="stylesheet" href="/css/sort-elements.css" />
		<link rel="stylesheet" href="/css/forms.css" />
		<link rel="stylesheet" href="/css/buttons.css" />
		<link rel="stylesheet" href="/css/skeleton.css" />
		<link rel="stylesheet" href="/css/toastr.css" />
		<style>
			html,
			body {
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
			}

			#kt_app_root {
				height: 100%;
				overflow-y: auto;
				-ms-overflow-style: none;
				scrollbar-width: none;
			}

			#kt_app_root::-webkit-scrollbar {
				display: none;
			}
			.invalid-feedback {
				position: absolute;
				bottom: -13px !important; /* o el valor que necesites */
				left: 0;
			}
			.pb-8px {
				padding-bottom: 8px;
			}

			.mb-8 {
				margin-bottom: 2rem !important;
			}

			.fs-1rem {
				font-size: 1rem !important;
			}
			.noUi-target {
				height: 6px !important;
			}

			.noUi-base,
			.noUi-connect {
				height: 100% !important;
				border-radius: 4px !important;
			}

			.noUi-horizontal .noUi-handle {
				width: 17px !important;
				height: 17px !important;
				top: -5.5px !important; /* CENTRADO REAL */
				border-radius: 50% !important;
				border: 1px solid #bebebe !important;
				background: #fff !important;
				box-shadow: none !important;
				cursor: pointer !important;
			}
			.editor-svg {
				display: block;
				border: 1px solid #dbdfe9;
				border-radius: 0.475rem;
				overflow: hidden;
			}
		</style>
	</head>
	<body
		id="kt_app_body"
		data-kt-app-layout="dark-sidebar"
		data-kt-app-header-fixed="true"
		data-kt-app-sidebar-enabled="true"
		data-kt-app-sidebar-fixed="true"
		data-kt-app-sidebar-hoverable="true"
		data-kt-app-sidebar-push-header="true"
		data-kt-app-sidebar-push-toolbar="true"
		data-kt-app-sidebar-push-footer="true"
		data-kt-app-toolbar-enabled="true"
		class="app-default"
	>
		<div class="d-flex flex-column flex-root app-root" id="kt_app_root">
			<app-root style="height: 100% !important"></app-root>
		</div>

		<script src="plugins/global/plugins.bundle.js"></script>
		<script src="js/scripts.bundle.js"></script>
		<script src="js/widgets.bundle.js"></script>
		<script src="js/custom/widgets.js"></script>
		<script src="js/prism.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
		<script src="https://momentjs.com/downloads/moment.js"></script>
		<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
		<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
		<script src="plugins/custom/fslightbox/fslightbox.bundle.js"></script>
	</body>
</html>
