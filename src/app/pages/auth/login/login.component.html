<div class="login-page">
	<main class="login-container">
		<header class="login-header">
			<!-- <img
				src="images/logos/logo-color.png"
				alt="Logo"
				class="login-logo"
			> -->

			<h1 class="login-title">Iniciar sesión</h1>

			<p class="login-description">Ingresa tus credenciales para acceder al panel administrativo.</p>
		</header>

		<div class="login-form">
			<div class="login-field">
				<label for="loginEmail" class="login-label">Correo electrónico</label>

				<input
					id="loginEmail"
					type="email"
					class="form-control form-control-md"
					[class.is-invalid]="errorsLogin?.email"
					placeholder="Correo electrónico"
					name="email"
					autocomplete="email"
					[(ngModel)]="auth.email"
					(keyup.enter)="login()"
					[disabled]="loading"
				/>

				<div *ngIf="errorsLogin?.email" class="invalid-feedback d-block">
					{{ errorsLogin.email[0] || ' ' }}
				</div>
			</div>

			<div class="login-field">
				<div class="d-flex align-items-center justify-content-between gap-3">
					<label for="loginPassword" class="login-label">Contraseña</label>

					<a class="login-recovery">¿Olvidaste tu contraseña?</a>
				</div>

				<input
					id="loginPassword"
					type="password"
					class="form-control form-control-md"
					[class.is-invalid]="errorsLogin?.password"
					placeholder="Contraseña"
					name="password"
					autocomplete="current-password"
					[(ngModel)]="auth.password"
					(keyup.enter)="login()"
					[disabled]="loading"
				/>

				<div *ngIf="errorsLogin?.password" class="invalid-feedback d-block">
					{{ errorsLogin.password[0] || ' ' }}
				</div>
			</div>

			<button type="button" class="btn btn-primary btn-md w-100 mt-2" [disabled]="loading" (click)="!loading && login()">
				<span *ngIf="loading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>

				<span>
					{{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
				</span>
			</button>
		</div>

		<footer class="login-footer">Acceso exclusivo para usuarios autorizados</footer>
	</main>
</div>
