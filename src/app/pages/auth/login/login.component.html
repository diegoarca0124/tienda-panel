<div class="login-page">
	<main class="login-container">
		<header class="login-header">
			<h1 class="login-title">Iniciar sesión</h1>
			<p class="login-description">Ingresa tus credenciales para acceder al panel administrativo.</p>
		</header>

		<div class="login-form">
			<div class="login-field">
				<label for="loginEmail" class="login-label">Correo electrónico</label>

				<input
					id="loginEmail"
					type="email"
					class="form-control form-control-md"
					[class.is-invalid]="errorsLogin?.email"
					placeholder="Correo electrónico"
					name="email"
					autocomplete="email"
					[(ngModel)]="auth.email"
					(keyup.enter)="login()"
					[disabled]="loading"
				/>
			</div>

			<div class="login-field">
				<div class="d-flex align-items-center justify-content-between gap-3">
					<label for="loginPassword" class="login-label">Contraseña</label>

					<a class="login-recovery">¿Olvidaste tu contraseña?</a>
				</div>

				<div class="login-password">
					<input
						id="loginPassword"
						[type]="showPassword ? 'text' : 'password'"
						class="form-control form-control-md"
						[class.is-invalid]="errorsLogin?.password"
						placeholder="Contraseña"
						name="password"
						autocomplete="current-password"
						[(ngModel)]="auth.password"
						(keyup.enter)="login()"
						[disabled]="loading"
					/>
					<button
						type="button"
						class="login-password-toggle"
						[attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
						[attr.aria-pressed]="showPassword"
						aria-controls="loginPassword"
						[disabled]="loading"
						(click)="showPassword = !showPassword"
					>
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
							<circle cx="12" cy="12" r="3"></circle>
							@if (showPassword) {
								<path d="m3 3 18 18"></path>
							}
						</svg>
					</button>
				</div>
			</div>

			<button type="button" class="btn btn-primary btn-md w-100 mt-2" [disabled]="loading" (click)="!loading && login()">
				<span *ngIf="loading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>

				<span>
					{{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
				</span>
			</button>
		</div>

		<footer class="login-footer">Acceso exclusivo para usuarios autorizados</footer>
	</main>
</div>
