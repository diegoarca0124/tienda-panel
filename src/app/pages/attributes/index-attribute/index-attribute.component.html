<div class="app-page flex-column flex-column-fluid" id="kt_app_page">
	<app-topbar></app-topbar>
	<div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
		<app-sidebar></app-sidebar>
		<div class="app-main flex-column flex-row-fluid">
			<div class="d-flex flex-column flex-column-fluid">
				<div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
					<div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
						<div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
							<h1 class="page-heading d-flex text-dark fw-bold fs-3 flex-column justify-content-center my-0">Atributos</h1>

							<ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
								<li class="breadcrumb-item text-primary">Atributos</li>
							</ul>
						</div>
						<div class="d-flex align-items-center gap-2 gap-lg-3">
							<a [routerLink]="['/products/attributes/create']" routerLinkActive="router-link-active" class="btn btn-sm fw-bold btn-primary">
								Nuevo Atributo
							</a>
						</div>
					</div>
				</div>
				<div class="app-content flex-column-fluid">
					<div class="app-container container-fluid">
						<div class="row">
							<div class="col-lg-4">
								<div class="position-relative">
									<!-- Input con padding extra a la derecha -->
									<input
										type="text"
										class="form-control pe-5" 
										[placeholder]="'Buscar propiedad'"
										name="filter"
										[(ngModel)]="filter"
										(keyup)="onFilterOrStatusChange()"
									/>

									<!-- Icono dentro del input -->
									<i 
										class="bi bi-search position-absolute top-50 translate-middle-y cursor-pointer"
										style="right: 12px"
										(click)="onFilterOrStatusChange()"
									></i>
								</div>
							</div>
							<div class="col-lg-4">
								<ng-select
									[items]="statusTable"
									bindLabel="name"
									bindValue="value"
									name="status"
									(change)="onFilterOrStatusChange()"
									[(ngModel)]="status"
									placeholder="Estado"
									[clearable]="false"
									[closeOnSelect]="true"
									class="select-element mb-1"
									appendTo="body"
									[searchable]="false"
								>
									<!-- Opción en el dropdown -->
									<ng-template ng-option-tmp let-item="item">
										<div class="d-flex align-items-center gap-2">
										<span class="bullet bullet-dot h-10px w-10px" [ngClass]="'bg-' + item.color"></span>
										<span>{{ item.name }}</span>
										</div>
									</ng-template>

									<!-- Opción seleccionada en el input -->
									<ng-template ng-label-tmp let-item="item">
										<div class="d-flex align-items-center gap-2">
										<span class="bullet bullet-dot h-10px w-10px" [ngClass]="'bg-' + item.color"></span>
										<span>{{ item.name }}</span>
										</div>
									</ng-template>
								</ng-select>
							</div>
							<div class="col-lg-4">
								<app-menu-select-categories 
								(applyCategories)="getCategories($event)"
								[selectedCategories]="categories"
								[title]="'Filtrar categorías'"
								[placeholder]="'Buscar categoría'">
								</app-menu-select-categories>
							</div>	
						</div>

						<div class="table-responsive my-7">
							<table class="table table-bordered table-fixed modern-table mb-0" 
							[ngClass]="{
							'h-100': attributes.length == 0 && !loading,
							'table-hover': attributes.length >= 1,
							}">
								<colgroup>
									<col *ngFor="let col of columns" [ngClass]="col.classCol">
									<col style="width: 38px">
								</colgroup>
								<thead style="background-color: #f8f8f8;">
									<tr>
										<th
											*ngFor="let col of columns"
											(click)="!loading && sortData(col.key)"
											[ngClass]="[
												col.classCol,
												!loading ? 'cursor-pointer' : 'cursor-disabled'
											]"
										>
											<div class="d-flex justify-content-between align-items-center">
												<span class="fw-500 fs-7">{{ col.label }}</span>
												<i class="bi" [ngClass]="getSortIcon(col.key)"></i>
											</div>
										</th>
										<th>
										</th>
									</tr>
								</thead>

								<tbody>
									<!-- ======================= LOADING (SKELETON) ======================= -->
									<ng-container *ngIf="loading">
										<tr *ngFor="let s of arrDataSkull">
											<td class="col-w-xs-200 col-w-md-250" style="height: 47.63px !important;">
												<div class="d-flex align-items-center gap-2">
													<div class="form-control-solid form-control-load" style="width: 32px; height: 32px; border-radius: 5px"></div>

													<div class="d-flex flex-column gap-2" style="width: 100%; max-width: 250px">
														<div class="form-control-solid form-control-load" style="height: 10px; width: 60%; border-radius: 3px"></div>
														<div class="form-control-solid form-control-load" style="height: 9px; width: 40%; border-radius: 3px"></div>
													</div>
												</div>
											</td>

											<td class="col-w-xs-100" style="height: 47.63px !important;">
												<div class="form-control-solid form-control-load" style="height: 20px; width: 70px; border-radius: 50rem"></div>
											</td>

											<td class="col-actions" style="height: 47.63px !important;">
												<div class="form-control-solid form-control-load" style="height: 30px; width: 35px; border-radius: 5px"></div>
											</td>
										</tr>
									</ng-container>

									<!-- ======================= DATOS ======================= -->
									<ng-container *ngIf="!loading && attributes.length >= 1">
										<tr *ngFor="let item of attributes">

											<td class="col-w-xs-200 col-w-md-250">
												<div class="d-flex align-items-center">
													<div class="d-flex flex-column">
														<a class="text-decoration-none text-dark"> {{ item.name }} ({{ item.valuesCount }}) </a>
														<small class="text-primary">
															{{ item.categories.join(', ') }}
														</small>
													</div>
												</div>
											</td>

											<td class="col-w-xs-100">
												<span class="badge rounded-pill text-dark fw-800"
													[ngClass]="{ 'bg-outline-danger': !item.status, 'bg-outline-success': item.status }">
												<span class="d-inline-block rounded-circle me-1"
														style="width: 8px; height: 8px"
														[ngClass]="{ 'bg-danger': !item.status, 'bg-success': item.status }"></span>
												{{ item.status ? 'Activo' : 'Inactivo' }}
												</span>
											</td>

											<td class="col-actions">
												<div class="dropdown">
													<button class="icon-btn dropdown-toggle"
													data-bs-toggle="dropdown"
													aria-expanded="false">
														<i class="bi bi-three-dots"></i>
													</button>

													<app-modal-delete
														[id]="'modalDelete-' + item.id"
														[title]="item.status ? 'Desactivar el registro' : 'Activar el registro'"
														[description]="
															item.status
																? `¿Estás seguro de que deseas desactivar a <b>${item.name}</b>?`
																: `¿Estás seguro de que deseas activar a <b>${item.name}</b>?`
														"
														[textButton]="item.status ? 'Desactivar' : 'Activar'"
														(actionConfirmed)="setStatus(item.id!, item.status!)"
														[loadBtnDelete]="loadBtnDelete"
													>
													</app-modal-delete>

													<div id="dropdown" class="dropdown-menu" data-bs-display="static">
														<a class="dropdown-item cursor-pointer" [routerLink]="['/products/attributes/' + item?.id + '/edit']">
															<i class="bi bi-pen me-2"></i>Editar
														</a>
														<a class="dropdown-item cursor-pointer" data-bs-toggle="modal" [attr.data-bs-target]="'#modalDelete-' + item?.id">
															<i *ngIf="item?.status" class="bi bi-x-lg me-2"></i>
															<i *ngIf="!item?.status" class="bi bi-check2 me-2"></i>
															{{ item?.status ? 'Desactivar' : 'Activar' }}
														</a>
													</div>
												</div>
											</td>

										</tr>
									</ng-container>

									<!-- ======================= SIN RESULTADOS ======================= -->
									<tr *ngIf="!loading && attributes.length == 0">
										<td colspan="5">
											<app-not-found [error]="{ message: 'No se encontraron registros que coincidan.', statusCode: 404 }"></app-not-found>
										</td>
									</tr>

									<!-- ======================= ERROR ======================= -->
									<tr *ngIf="!loading && errorMsmServerListAttributes">
										<td colspan="5">
											<app-not-found [error]="errorMsmServerListAttributes"></app-not-found>
										</td>
									</tr>

								</tbody>

							</table>
						</div>

						<div class="d-flex justify-content-between" *ngIf="attributes.length >= 1">
							<div class="d-flex align-items-center gap-2">
								Ver
								<select class="form-select form-select-sm w-auto" name="limit" [(ngModel)]="limit" (change)="setLimit()">
									<option value="10">10</option>
									<option value="20">20</option>
									<option value="25">25</option>
								</select>
								Por pagina
							</div>
							<div class="d-flex align-items-center gap-3">
								<app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChanged)="onPageChange($event)"> </app-pagination>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
