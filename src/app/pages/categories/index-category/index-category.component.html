<div class="app-page flex-column flex-column-fluid" id="kt_app_page">
	<app-topbar></app-topbar>
	<div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
		<app-sidebar></app-sidebar>
		<div class="app-main flex-column flex-row-fluid">
			<div class="d-flex flex-column flex-column-fluid">
				<div id="kt_app_toolbar" class="app-toolbar py-3 py-lg-6">
					<div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
						<div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
							<h1 class="page-heading d-flex text-dark fw-bold fs-3 flex-column justify-content-center my-0">Categorías</h1>

							<ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
								<li class="breadcrumb-item text-primary">Categorías</li>
							</ul>
						</div>
						<div class="d-flex align-items-center gap-2 gap-lg-3">
							<a [routerLink]="['/products/categories/create']" routerLinkActive="router-link-active" class="btn btn-sm fw-bold btn-primary">
								Nuevo Categoría
							</a>
						</div>
					</div>
				</div>
				<div class="app-content flex-column-fluid">
					<div class="app-container container-fluid">
						<div class="row g-3 g-lg-4">
							<div class="col-12">
								<div class="d-flex justify-content-between flex-nowrap gap-2 mt-5">
									<div class="d-flex gap-2">
										<div>
											<div class="d-flex align-items-center position-relative">
												<input
													type="text"
													class="form-control form-control-sm w-200px"
													placeholder="Buscar categoría"
													name="filter"
													[(ngModel)]="filter"
													(keyup.ENTER)="redirect()"
												/>
												<i class="bi bi-search position-absolute cursor-pointer" style="right: 20px" (click)="redirect()"></i>
											</div>
										</div>
										<div>
											<select class="form-select form-select-sm w-auto" name="status" [(ngModel)]="status" (change)="redirect()">
												<option value="Todos">Todos</option>
												<option value="Activos">Activos</option>
												<option value="Inactivos">Inactivos</option>
											</select>
										</div>
									</div>
									<div class="dropdown">
										<button
											class="btn btn-primary btn-sm dropdown-toggle my-1"
											type="button"
											id="dropdownMenuButton"
											data-bs-toggle="dropdown"
											aria-expanded="false"
										>
											<i class="bi bi-sliders"></i> Opciones
										</button>
										<ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
											<li>
												<a class="dropdown-item cursor-pointer" data-bs-toggle="modal" [attr.data-bs-target]="'#modalExport'">
													<i class="bi bi-filetype-xls me-2"></i> Exportar XLS
												</a>
											</li>
											<li>
												<hr class="dropdown-divider" />
											</li>
											<!-- Separador -->
											<!-- Opción "Edit" -->
											<li>
												<a class="dropdown-item" href="#"> <i class="bi bi-folder-symlink me-2"></i> Importar </a>
											</li>
										</ul>
									</div>
								</div>

								<div class="content-table-responsive">
									<div class="table-responsive my-7">
										<table
											class="table table-bordered align-middle mb-0 bg-white"
											[ngClass]="{
												'h-100': categories.length == 0 && !loading,
												'table-hover': categories.length >= 1,
											}"
										>
											<thead class="table-dark">
												<tr>
													<th
														*ngFor="let col of columns"
														[style.width]="col.width"
														(click)="!loading && sortData(col.key)"
														[ngClass]="{ 'cursor-pointer': !loading, 'cursor-disabled': loading }"
													>
														<div class="d-flex justify-content-between align-items-center">
															<span class="text-uppercase fw-500">{{ col.label }}</span>
															<i class="bi" [ngClass]="getSortIcon(col.key)"></i>
														</div>
													</th>
													<th style="width: 10%" class="text-end text-uppercase fw-500">Acciones</th>
												</tr>
											</thead>
											<tbody *ngIf="!loading">
												<ng-container *ngIf="!errorMsmServerListCategories">
													<ng-container *ngIf="categories.length >= 1">
														<tr *ngFor="let item of categories">
															<td class="h-58px">
																<div class="d-flex align-items-center gap-2">
																	<div class="symbol me-3">
																		<span
																			class="symbol-label fw-bold"
																			style="height: 36px; width: 36px; border: 1px dashed #e3e3e3"
																			[innerHTML]="item.safeIcon"
																		>
																		</span>
																	</div>
																	<div class="d-flex flex-column">
																		<a class="text-decoration-none text-dark">
																			{{ item.name }}
																		</a>
																		<small class="text-gray-600">{{ item.slug }}</small>
																	</div>
																</div>
															</td>
															<td class="h-58px">
																<span
																	class="badge rounded-pill text-dark fw-700"
																	[ngClass]="{ 'bg-outline-danger': !item.status, 'bg-outline-success': item.status }"
																>
																	<span
																		class="d-inline-block bg-danger rounded-circle me-1"
																		style="width: 8px; height: 8px"
																		[ngClass]="{ 'bg-danger': !item.status, 'bg-success': item.status }"
																	></span>
																	{{ item.status ? 'Activo' : 'Inactivo' }}
																</span>
															</td>
															<td class="text-end position-relative h-58px">
																<div class="dropdown">
																	<button
																		class="btn btn-light btn-sm border-dashed dropdown-toggle"
																		data-bs-toggle="dropdown"
																		aria-expanded="false"
																		style="padding-right: 10.25px !important; padding-left: 10.25px !important"
																	>
																		<i class="bi bi-three-dots-vertical"></i>
																	</button>
																	<app-modal-delete
																		[id]="'modalDelete-' + item.id"
																		[title]="item.status ? 'Desactivar el registro' : 'Activar el registro'"
																		[description]="
																			item.status
																				? `¿Estás seguro de que deseas desactivar a <b>${item.name}</b>?`
																				: `¿Estás seguro de que deseas activar a <b>${item.name}</b>?`
																		"
																		[textButton]="item.status ? 'Desactivar' : 'Activar'"
																		(actionConfirmed)="setStatus(item.id!, item.status!)"
																		[loadBtnDelete]="loadBtnDelete"
																	>
																	</app-modal-delete>

																	<div id="dropdown" class="dropdown-menu" data-bs-display="static">
																		<a class="dropdown-item cursor-pointer" [routerLink]="['/products/categories/' + item?.id + '/edit']">
																			<i class="bi bi-pen me-2"></i>Editar
																		</a>
																		<a class="dropdown-item cursor-pointer" data-bs-toggle="modal" [attr.data-bs-target]="'#modalDelete-' + item?.id">
																			<i *ngIf="item?.status" class="bi bi-x-lg me-2"></i>
																			<i *ngIf="!item?.status" class="bi bi-check2 me-2"></i>
																			{{ item?.status ? 'Desactivar' : 'Activar' }}
																		</a>
																	</div>
																</div>
															</td>
														</tr>
													</ng-container>
													<ng-container *ngIf="categories.length == 0">
														<tr class="" style="background-color: #f9f9f9">
															<td>
																<app-not-found title="No se encontraron registros que coincidan."></app-not-found>
															</td>
														</tr>
													</ng-container>
												</ng-container>
												<ng-container *ngIf="errorMsmServerListCategories">
													<tr style="background-color: #f9f9f9">
														<td colspan="5">
															<app-not-found [error]="errorMsmServerListCategories"></app-not-found>
														</td>
													</tr>
												</ng-container>
											</tbody>

											<!-- INICIO PRECARGADOR -->
											<tbody *ngIf="loading">
												<tr *ngFor="let item of arrDataSkull">
													<td class="h-58px">
														<div class="d-flex align-items-center gap-2">
															<div class="form-control-solid form-control-load" style="width: 36px; height: 36px"></div>
															<!-- Esto puede quedar así, es pequeño pero fijo -->
															<div class="d-flex flex-column gap-2" style="width: 300px">
																<!-- Esto permitirá que el contenido se ajuste -->
																<div class="form-control-solid form-control-load" style="height: 13px; width: 60%; max-width: 120px"></div>
																<!-- 60% o max-width -->
																<div class="form-control-solid form-control-load" style="height: 9px; width: 40%; max-width: 80px"></div>
																<!-- 40% o max-width -->
															</div>
														</div>
													</td>

													<td class="h-58px">
														<div class="form-control-solid form-control-load" style="height: 21.05px; width: 71.4px; border-radius: 50rem"></div>
													</td>

													<td class="d-flex justify-content-end h-58px">
														<div class="form-control-solid form-control-load" style="height: 36.48px; width: 40.05px; border-radius: 5px"></div>
													</td>
												</tr>
											</tbody>
										</table>
									</div>
									<div class="d-flex justify-content-between" *ngIf="categories.length >= 1">
										<div class="d-flex align-items-center gap-2">
											Ver
											<select class="form-select form-select-sm w-auto" name="limit" [(ngModel)]="limit" (change)="setLimit()">
												<option value="10">10</option>
												<option value="20">20</option>
												<option value="25">25</option>
											</select>
											Por pagina
										</div>
										<div class="d-flex align-items-center gap-3">
											<app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChanged)="onPageChange($event)"> </app-pagination>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
