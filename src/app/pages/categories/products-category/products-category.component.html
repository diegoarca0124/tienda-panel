<div class="app-page flex-column flex-column-fluid" id="kt_app_page">
	<app-topbar></app-topbar>
	<div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
		<app-sidebar></app-sidebar>
		<div class="app-main flex-column flex-row-fluid">
			<div class="d-flex flex-column flex-column-fluid">
				<div id="kt_app_toolbar" class="app-toolbar page-header py-5 py-lg-6">
					<div id="kt_app_toolbar_container" class="app-container container-fluid page-header-layout">
						<div class="page-header-content">
							<nav aria-label="Navegación actual">
								<ol class="page-header-breadcrumb">
									<li class="page-header-breadcrumb-item">
										<a class="page-header-breadcrumb-link" [routerLink]="['/products/categories']">Categorías</a>
									</li>

									<li class="page-header-breadcrumb-item page-header-breadcrumb-active" aria-current="page">Productos</li>
								</ol>
							</nav>

							<h1 class="page-header-title d-flex align-items-center gap-2">
								<span>Productos de</span>
								@if (isProductsLoading && !categoryName) {
									<span class="skeleton skeleton-title" aria-label="Cargando nombre de la categoría"></span>
								} @else {
									<span>{{ categoryName || 'la categoría' }}</span>
								}
							</h1>
						</div>
					</div>
				</div>
				<div class="app-content flex-column-fluid mt-5">
					<div class="app-container container-fluid">
						<div class="section-sidebar-layout">
							<main class="section-sidebar-content products-section-content">
								<div class="list-toolbar">
									<!-- Buscador -->
									<div class="list-toolbar-search">
										<div class="list-toolbar-search-field">
											<input
												type="text"
												class="form-control form-control-sm"
												placeholder="Buscar producto"
												name="filter"
												[(ngModel)]="filter"
												(keyup.enter)="applyFilters()"
												[disabled]="isProductsLoading"
												maxlength="50"
											/>
											<i class="bi bi-search list-toolbar-input-icon" aria-hidden="true"></i>
										</div>
										<!-- Buscar -->
										<button
											type="button"
											class="btn btn-sm btn-icon btn-primary"
											(click)="applyFilters()"
											[disabled]="isProductsLoading"
											aria-label="Buscar producto"
											title="Buscar producto"
										>
											<i *ngIf="!isProductsLoading" class="bi bi-search"></i>
											<span *ngIf="isProductsLoading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
										</button>

										<button
											type="button"
											class="btn btn-sm btn-icon btn-light-primary"
											(click)="resetFilters()"
											[disabled]="isProductsLoading"
											aria-label="Restablecer filtros"
											title="Restablecer filtros"
										>
											<i *ngIf="!isProductsLoading" class="bi bi-arrow-clockwise" aria-hidden="true"></i>
											<span *ngIf="isProductsLoading" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
										</button>
									</div>
									<!-- Acciones del lado derecho -->
									<div class="list-toolbar-actions">
										<button
											class="btn btn-light-primary btn-sm d-none d-md-flex align-items-center gap-2"
											type="button"
											data-bs-toggle="modal"
											[attr.data-bs-target]="'#modalMove'"
											[disabled]="!hasSelectedProducts()"
										>
											<ion-icon name="folder-outline"></ion-icon>
											Mover productos
										</button>

										<div class="dropdown action-dropdown">
											<button
												id="productsOptionsButton"
												type="button"
												class="btn btn-sm btn-dark"
												data-bs-toggle="dropdown"
												data-bs-offset="0,10"
												aria-expanded="false"
												aria-label="Opciones"
												title="Opciones"
											>
												<ion-icon name="settings-outline" aria-hidden="true"></ion-icon>
												<span class="app-btn-label">Opciones</span>
												<ion-icon name="chevron-down-outline" class="app-btn-chevron" aria-hidden="true"></ion-icon>
											</button>
											<ul class="dropdown-menu dropdown-menu-end action-dropdown-menu" aria-labelledby="productsOptionsButton">
												<li class="d-md-none">
													<button
														type="button"
														class="dropdown-item action-dropdown-item action-dropdown-item-compact"
														[attr.data-bs-toggle]="hasSelectedProducts() ? 'modal' : null"
														[attr.data-bs-target]="hasSelectedProducts() ? '#modalMove' : null"
														[disabled]="!hasSelectedProducts()"
													>
														<span class="action-dropdown-item-icon">
															<ion-icon class="fs-4" name="folder-outline" aria-hidden="true"></ion-icon>
														</span>
														<span class="action-dropdown-item-title">Mover productos</span>
													</button>
												</li>
												<li>
													<a class="dropdown-item action-dropdown-item action-dropdown-item-compact" [routerLink]="['/products/categories/mapping']">
														<span class="action-dropdown-item-icon">
															<ion-icon class="fs-4" name="document-outline" aria-hidden="true"></ion-icon>
														</span>
														<span class="action-dropdown-item-title">Mapeo</span>
													</a>
												</li>
											</ul>
										</div>
									</div>
								</div>

								<app-sidebar-products-category
									[(selectedStatus)]="selectedStatus"
									[(selectedSort)]="selectedSort"
									[(selectedQuality)]="selectedQuality"
									[(selectedVisibility)]="selectedVisibility"
									[categoryId]="id"
									[(selectedSubcategoryIds)]="selectedSubcategoryIds"
									[(selectedBrandIds)]="selectedBrandIds"
									[minPrice]="minPrice"
									(minPriceChange)="onMinPriceChange($event)"
									[maxPrice]="maxPrice"
									(maxPriceChange)="onMaxPriceChange($event)"
									[isLoading]="isProductsLoading"
									(apply)="applyFilters()"
								></app-sidebar-products-category>

								<app-table-products-category
									[products]="products"
									[isLoading]="isProductsLoading"
									[loadError]="productsLoadError"
									[selectedProductsIds]="selectedProductsIds"
									[currentPage]="currentPage"
									[totalPages]="totalPages"
									[limit]="limit"
									(productSelectionChange)="onProductSelectionChange($event.id, $event.event)"
									(productMoveRequested)="selectProductForMove($event)"
									(pageChanged)="onPageChange($event)"
									(limitChanged)="limit = $event; onLimitChange()"
								></app-table-products-category>
							</main>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<app-move-products-category
	[categories]="categories"
	[currentCategoryId]="id"
	[selectedProductsCount]="selectedProductsIds.size"
	[isCategoriesLoading]="isCategoriesLoading"
	[isMovingProducts]="isMovingProducts"
	[movingToSubcategoryId]="movingToSubcategoryId"
	[categoriesLoadError]="categoriesLoadError"
	(refresh)="initCategories()"
	(moveRequested)="moveSelectedProductsTo($event.category, $event.subcategory)"
></app-move-products-category>
