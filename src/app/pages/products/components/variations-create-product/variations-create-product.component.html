<div class="d-flex flex-column gap-6">
	@if (errorsProduct.variations) {
		<div
			class="alert alert-dismissible bg-light-danger d-flex flex-column flex-sm-row w-100 px-5 py-3 gap-3 mt-5 mb-0"
			style="border: 1px dashed #ccc; border-radius: 0px !important"
		>
			<app-icon-alert [classIcon]="'svg-icon-1 svg-icon-danger'"></app-icon-alert>

			<div class="d-flex align-items-center pe-0 pe-sm-10">
				<span class="text-gray-700">{{ errorsProduct.variations }}</span>
			</div>
		</div>
	}

	<div class="d-flex flex-column">
		<div class="d-flex align-items-center w-100">
			<div class="flex-grow-1 me-2">
				<div class="position-relative">
					<input
						type="text"
						class="form-control form-control-sm pe-15"
						placeholder="Tallas"
						name="name"
						[(ngModel)]="variation.name"
						[ngClass]="{ 'is-invalid': errorsVariation?.name }"
						(keyup.ENTER)="id ? onAddVariation() : onCreateVariation()"
					/>

					<span class="text-primary position-absolute top-50 end-0 translate-middle-y me-3 fw-600 fs-8" style="pointer-events: none; background: #fff; padding: 1px">[ENTER]</span>
				</div>
			</div>
			<button
				type="button"
				class="btn btn-icon bg-light-secondary"
				(click)="id ? onAddVariation() : onCreateVariation()"
				[disabled]="loadCreateVariation"
				[ngClass]="{ 'me-2': id }"
			>
				<span *ngIf="loadCreateVariation" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>

				<ion-icon *ngIf="!loadCreateVariation" name="add-outline" class="fs-4 text-gray-800"></ion-icon>
			</button>
			<button
				*ngIf="id"
				type="button"
				class="btn btn-sm bg-primary-light d-flex align-items-center justify-content-center p-0 btn-refresh"
				(click)="init_variations()"
				[disabled]="loadVariations"
			>
				<span *ngIf="loadVariations" class="spinner-border spinner-border-sm text-primary"></span>

				<i *ngIf="!loadVariations" class="bi bi-arrow-clockwise fs-5 text-primary"></i>
			</button>
		</div>
		<div class="validation-wrapper" [class.open]="errorsVariation?.name">
			<app-validation-popover [errors]="errorsVariation?.name"></app-validation-popover>
		</div>
	</div>
	<div class="row">
		<div class="col-12">
			<div class="table-wrapper" *ngIf="id">
				<table class="table custom-table align-middle mb-0">
					<thead>
						<tr>
							<th class="fixed-xs text-center p-0">
								<label class="form-check form-check-customs form-check-sm m-0 d-flex align-items-center justify-content-center h-100">
									<input class="form-check-input cursor-pointer" type="checkbox" disabled />
								</label>
							</th>
							<th class="flex-column">Variación</th>
							<th class="fixed-md">Estado</th>
							<th class="fixed-xs text-center text-center"></th>
						</tr>
					</thead>
					<tbody>
						<ng-container *ngIf="loadVariations">
							<tr *ngFor="let item of [1, 2, 3, 4, 5, 6]">
								<td class="fixed-xs text-center p-0">
									<div class="skeleton skeleton-check"></div>
								</td>
								<td class="flex-column fw-medium">
									<div class="skeleton skeleton-text"></div>
								</td>
								<td class="fixed-md">
									<div class="skeleton skeleton-badge" style="height: 17.7px; width: 64px"></div>
								</td>
								<td class="fixed-xs text-center p-0">
									<div class="skeleton skeleton-btn" style="height: 20px; width: 20px"></div>
								</td>
							</tr>
						</ng-container>
						<ng-container *ngIf="!loadVariations && variations.length >= 1">
							<tr *ngFor="let item of variations">
								<td class="fixed-xs text-center p-0">
									<label class="form-check form-check-customs form-check-sm m-0 d-flex align-items-center justify-content-center h-100">
										<input class="form-check-input cursor-pointer" type="checkbox" />
									</label>
								</td>
								<td class="flex-column fw-medium" [ngClass]="{ 'p-none': variationEdit.id == item.id }" style="height: 31px !important">
									<div class="d-flex justify-content-between align-items-center" *ngIf="variationEdit.id != item.id">
										<small class="text-gray-800" style="font-size: 12px !important">{{ item.name }}</small>
										<small class="text-primary cursor-pointer" style="font-size: 0.8rem !important" (click)="onEditVariation(item)">Editar</small>
									</div>
									<div class="position-relative" *ngIf="variationEdit.id == item.id" style="height: 45px !important">
										<input
											[id]="'variation-input-' + item.id"
											type="text"
											class="form-control pe-10 border-none h-100 form-control-invisible"
											[(ngModel)]="variationEdit.name"
											style="font-size: 12px !important; padding: 0.35rem 1rem"
											(keyup.ENTER)="onUpdateNameVariation()"
										/>
										<div class="position-absolute top-50 end-0 translate-middle-y d-flex align-items-center gap-2 me-2">
											<small
												[ngClass]="{ 'text-primary cursor-pointer': !loadBtnUpdateName, 'text-muted': loadBtnUpdateName }"
												style="font-size: 0.8rem !important"
												(click)="onUpdateNameVariation()"
											>
												{{ !loadBtnUpdateName ? 'Actualizar' : 'Procesando' }}
											</small>
										</div>
									</div>
								</td>

								<td class="fixed-md">
									<span
										class="badge rounded-pill text-gray-700 fw-800"
										[ngClass]="{ 'bg-outline-danger': !item.status, 'bg-outline-success': item.status }"
										style="padding: 3px 9px !important; font-size: 0.8rem"
									>
										<span class="d-inline-block rounded-circle me-2" style="width: 6px; height: 6px" [ngClass]="{ 'bg-danger': !item.status, 'bg-success': item.status }"></span>
										{{ item.status ? 'Activo' : 'Inactivo' }}
									</span>
								</td>
								<td class="fixed-xs text-center p-0">
									<button
										class="icon-btn btn-action d-flex align-items-center justify-content-center mx-auto"
										[ngClass]="{ 'btn-light-danger': item.status, 'btn-light-success': !item.status }"
										data-bs-toggle="modal"
										[attr.data-bs-target]="'#modalDelete-' + item?.id"
									>
										<i *ngIf="item.status" class="bi bi-x text-danger fs-5" title="Desactivar"></i>
										<i *ngIf="!item.status" class="bi bi-check text-success fs-5" title="Activar"></i>
									</button>
									<app-modal-delete
										[id]="'modalDelete-' + item.id"
										[title]="item.status ? 'Desactivar Variación' : 'Activar Variación'"
										[description]="item.status ? '¿Estás seguro de que deseas desactivar esta variación?' : '¿Estás seguro de que deseas activar esta variación?'"
										[textButton]="item.status ? 'Desactivar' : 'Activar'"
										(actionConfirmed)="onUpdateStatus(item.id, item.status)"
										[loadBtnDelete]="loadBtnStatus"
									></app-modal-delete>
								</td>
							</tr>
						</ng-container>
						<ng-container *ngIf="!loadVariations && variations.length == 0 && !errorMsmSeverListVariations">
							<tr>
								<td colspan="4">
									<app-not-found [error]="{ message: 'No se encontraron registros.', statusCode: 404 }"></app-not-found>
								</td>
							</tr>
						</ng-container>
						<ng-container *ngIf="!loadVariations && variations.length == 0 && errorMsmSeverListVariations">
							<tr>
								<td colspan="4">
									<app-not-found [error]="errorMsmSeverListVariations"></app-not-found>
								</td>
							</tr>
						</ng-container>
					</tbody>
				</table>
			</div>
			<ng-container *ngIf="!id">
				<div class="table-wrapper" *ngIf="variations.length >= 1">
					<table class="table custom-table align-middle mb-0">
						<thead>
							<tr>
								<th class="fixed-xs text-center p-0">
									<label class="form-check form-check-customs form-check-sm m-0 d-flex align-items-center justify-content-center h-100">
										<input class="form-check-input cursor-pointer" type="checkbox" disabled />
									</label>
								</th>
								<th class="flex-column">Variación</th>
								<th class="fixed-md">Estado</th>
								<th class="fixed-xs text-center text-center"></th>
							</tr>
						</thead>
						<tbody>
							<tr *ngFor="let item of variations; let idx = index">
								<td class="fixed-xs text-center p-0">
									<label class="form-check form-check-customs form-check-sm m-0 d-flex align-items-center justify-content-center h-100">
										<input class="form-check-input cursor-pointer" type="checkbox" />
									</label>
								</td>
								<td class="flex-column fw-medium">
									<small class="text-gray-800">{{ item.name }}</small>
								</td>
								<td class="fixed-md">
									<span class="badge rounded-pill text-gray-700 fw-800 bg-outline-success" style="padding: 3px 9px !important; font-size: 0.8rem">
										<span class="d-inline-block rounded-circle me-2 bg-success" style="width: 6px; height: 6px"></span>
										Activo
									</span>
								</td>
								<td class="fixed-xs text-center p-0">
									<button
										class="icon-btn btn-action d-flex align-items-center justify-content-center mx-auto btn-light-danger"
										(click)="onRemoveVariation(idx)"
										placement="top"
										[ngbTooltip]="'Eliminar registro'"
										tooltipClass="tooltip-dark"
									>
										<i class="bi bi-x text-danger fs-7" title="Desactivar"></i>
									</button>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
				<ng-container *ngIf="variations.length == 0">
					<div class="card" style="box-shadow: none !important; border-color: #dce0ea !important">
						<div class="card-body p-0">
							<app-not-found [error]="{ message: 'No se encontraron registros que coincidan.', statusCode: 404 }"></app-not-found>
						</div>
					</div>
				</ng-container>
			</ng-container>
		</div>
	</div>
</div>
