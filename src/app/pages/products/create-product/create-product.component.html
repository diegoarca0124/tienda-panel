<div class="app-page flex-column flex-column-fluid" id="kt_app_page">
	<app-topbar></app-topbar>
	<div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
		<app-sidebar></app-sidebar>
		<div class="app-main flex-column flex-row-fluid">
			<div class="d-flex flex-column flex-column-fluid">
				<div id="kt_app_toolbar" class="app-toolbar py-5 py-lg-6">
					<div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
						<div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
							<h1 class="page-heading d-flex text-dark fw-bold fs-3 flex-column justify-content-center my-0">Articulos</h1>

							<ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
								<li class="breadcrumb-item text-muted">
									<a [routerLink]="['/products/articles']" class="text-muted text-hover-primary"> Articulos </a>
								</li>
								<li class="breadcrumb-item">
									<span class="bullet bg-gray-400 w-5px h-2px"></span>
								</li>
								<li class="breadcrumb-item text-primary">Nuevo articulo</li>
							</ul>
						</div>
						<div class="d-flex align-items-center gap-2 gap-lg-3"></div>
					</div>
				</div>
				<div class="app-content flex-column-fluid">
					<div class="app-container container">
						<div class="row">
							<div class="col-lg-3">
								<div class="card card-flush py-4 mb-7">
									<div class="card-header">
										<div class="card-title">
											<h2>Visibilidad</h2>
										</div>
									</div>
									<div class="card-body d-flex flex-column gap-6 pt-0">
										<div class="fv-row">
											<label class="required form-label">Visibilidad</label>
											<select name="" class="form-select">
												<option value="Publico">Publico</option>
												<option value="Privado">Privado</option>
											</select>
										</div>
										<div class="fv-row">
											<label class="required form-label">Estado</label>
											<select name="" class="form-select">
												<option value="Publicado">Publicado</option>
												<option value="Borrador">Borrador</option>
											</select>
										</div>

										<div class="d-flex gap-3">
											<a class="btn btn-primary btn-sm flex-fill"> Publicar </a>
											<a class="btn btn-light-primary btn-sm flex-fill">Vista previa </a>
										</div>
									</div>
								</div>
								<div class="card card-flush py-4">
									<div class="card-header">
										<div class="card-title">
											<h2>Caracteristicas</h2>
										</div>
									</div>
									<div class="card-body d-flex flex-column gap-6 pt-0">
										<div class="fv-row">
											<label class="form-label">Categoría</label>
											<ng-select
												[items]="categories_"
												bindLabel="name"
												bindValue="id"
												[(ngModel)]="categorySelected"
												placeholder="Categorías"
												[clearable]="false"
												[closeOnSelect]="true"
												class="select-element"
												(change)="onSelectCategory()"
												[loading]="loadingCategories"
												[disabled]="loadingCategories"
												appendTo="body"
											>
												<!-- Opción en el dropdown -->
												<ng-template ng-option-tmp let-item="item">
													{{ item.name }}
												</ng-template>

												<!-- Opción seleccionada en el input -->
												<ng-template ng-label-tmp let-item="item">
													{{ item.name }}
												</ng-template>

												<ng-template ng-loading-text>
													<div class="spinner-container">
														<span class="spinner-border spinner-border-sm"></span>
													</div>
												</ng-template>
											</ng-select>
										</div>
										<div class="fv-row">
											<label class="form-label">Subcategoría</label>
											<ng-select
												[items]="subcategories_"
												bindLabel="name"
												bindValue="id"
												[(ngModel)]="subcategorySelected"
												placeholder="Subcategorías"
												[clearable]="false"
												[closeOnSelect]="true"
												class="select-element"
												[loading]="loadingSubcategories"
												[disabled]="loadingSubcategories"
												appendTo="body"
											>
												<!-- Opción en el dropdown -->
												<ng-template ng-option-tmp let-item="item">
													{{ item.name }}
												</ng-template>

												<!-- Opción seleccionada en el input -->
												<ng-template ng-label-tmp let-item="item">
													{{ item.name }}
												</ng-template>

												<ng-template ng-loading-text>
													<div class="spinner-container">
														<span class="spinner-border spinner-border-sm"></span>
													</div>
												</ng-template>
											</ng-select>
										</div>
										<div class="fv-row">
											<label class="form-label">País de fabricación</label>
											<ng-select
												[items]="countries"
												bindLabel="country"
												placeholder="Países"
												[clearable]="false"
												appendTo="body"
												class="select-element"
											>
												<!-- Opción en el dropdown -->
												<ng-template ng-option-tmp let-item="item">
													<img [src]="item.flag" width="20" height="15" style="margin-right: 8px" />
													{{ item.name }}
												</ng-template>

												<!-- Opción seleccionada en el input -->
												<ng-template ng-label-tmp let-item="item">
													<img [src]="item.flag" width="20" height="15" style="margin-right: 8px" />
													{{ item.name }}
												</ng-template>
											</ng-select>
										</div>
										<div class="fv-row">
											<label class="form-label">Marca</label>
											<ng-select
												[items]="brands_"
												bindLabel="name"
												bindValue="id"
												[(ngModel)]="brandSelected"
												placeholder="Buscar por marca"
												[clearable]="false"
												[closeOnSelect]="true"
												class="select-element"
												[loading]="loadingBrands"
												[disabled]="loadingBrands"
												appendTo="body"
											>
												<!-- 🔹 Opción en el dropdown -->
												<ng-template ng-option-tmp let-item="item">
													<div class="option-item">
														<img *ngIf="item.logoUrl" [src]="item.logoUrl" alt="{{ item.name }}" class="brand-image" />
														<span>{{ item.name }}</span>
													</div>
												</ng-template>

												<!-- 🔹 Opción seleccionada en el input -->
												<ng-template ng-label-tmp let-item="item">
													<div class="selected-item">
														<img *ngIf="item.logoUrl" [src]="item.logoUrl" alt="{{ item.name }}" class="brand-image" />
														<span>{{ item.name }}</span>
													</div>
												</ng-template>

												<ng-template ng-loading-text>
													<div class="spinner-container">
														<span class="spinner-border spinner-border-sm"></span>
													</div>
												</ng-template>
											</ng-select>
										</div>
									</div>
								</div>
							</div>
							<!--end::Table wrapper-->
							<div class="col-lg-9">
								<div class="card card-flush py-4">
									<div class="card-header">
										<div class="card-title">
											<h2>General</h2>
										</div>
										<div class="card-toolbar">
											<ul class="nav nav-pills">
												<li class="nav-item">
													<a class="nav-link cursor-pointer" [ngClass]="{ active: option == 1 }" (click)="setOption(1)">General</a>
												</li>
												<li class="nav-item">
													<a class="nav-link cursor-pointer" [ngClass]="{ active: option == 2 }" (click)="setOption(2)">Variaciones</a>
												</li>
												<li class="nav-item">
													<a class="nav-link cursor-pointer" [ngClass]="{ active: option == 3 }" (click)="setOption(3)">Link</a>
												</li>
											</ul>
										</div>
									</div>
									<div class="card-body d-flex flex-column gap-6 pt-0">
										<div class="fv-row">
											<label class="required form-label">Título</label>
											<input type="text" name="product_name" class="form-control" placeholder="Product name" value="" />
										</div>
										<div class="row">
											<div class="col-md-6">
												<label class="form-label">Precio Normal</label>
												<input
													currencyMask
													type="text"
													[options]="currencyOptions"
													class="form-control"
													placeholder="Precio Normal"
													name="priceRegular"
													[(ngModel)]="product.priceRegular"
												/>
											</div>
											<div class="col-md-6">
												<label class="form-label">Precio Descuento</label>
												<input
													currencyMask
													type="text"
													[options]="currencyOptions"
													class="form-control"
													placeholder="Precio Descuento"
													name="priceDiscount"
													[(ngModel)]="product.priceDiscount"
												/>
											</div>
										</div>
										<div class="d-flex flex-column">
											<label class="required form-label">Etiquetas</label>
											<app-tagify-input [whiteList]="whiteListTags"></app-tagify-input>
										</div>
										<div class="fv-row">
											<label class="required form-label">Contenido</label>
											<app-tinymce-editor [properties]="properties"></app-tinymce-editor>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
