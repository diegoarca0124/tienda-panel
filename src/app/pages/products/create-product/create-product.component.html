<div class="app-page flex-column flex-column-fluid" id="kt_app_page">
	<app-topbar></app-topbar>
	<div class="app-wrapper flex-column flex-row-fluid" id="kt_app_wrapper">
		<app-sidebar></app-sidebar>
		<div class="app-main flex-column flex-row-fluid">
			<div class="d-flex flex-column flex-column-fluid">
				<div id="kt_app_toolbar" class="app-toolbar py-5 py-lg-6">
					<div id="kt_app_toolbar_container" class="app-container container-fluid d-flex flex-stack">
						<div class="page-title d-flex flex-column justify-content-center flex-wrap me-3">
							<h1 class="page-heading d-flex text-dark fw-bold fs-3 flex-column justify-content-center my-0">Articulos</h1>

							<ul class="breadcrumb breadcrumb-separatorless fw-semibold fs-7 my-0 pt-1">
								<li class="breadcrumb-item text-muted">
									<a [routerLink]="['/products/articles']" class="text-muted text-hover-primary"> Articulos </a>
								</li>
								<li class="breadcrumb-item">
									<span class="bullet bg-gray-400 w-5px h-2px"></span>
								</li>
								<li class="breadcrumb-item text-primary">Nuevo articulo</li>
							</ul>
						</div>
						<div class="d-flex align-items-center gap-2 gap-lg-3"></div>
					</div>
				</div>
				<div class="app-content flex-column-fluid">
					<div class="app-container container">
                        <div class="card mb-10">
							<!--begin::Card header-->
							<div class="card-header">
								<!--begin::Heading-->
								<h4 class="card-title m-0 d-flex flex-column">
									<span class="fs-5">Nuevo Articulo</span>
									<span class="text-gray-600 mt-1 fw-400 fs-0-9rem">
										Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eligendi, quaerat..
									</span>
								</h4>
								<!--end::Heading-->
							</div>
							<!--end::Card header-->

							<!--begin::Card body-->
							<div class="card-body">
                                <div class="form d-flex flex-column flex-lg-row fv-plugins-bootstrap5 fv-plugins-framework">
                                    <div class="d-flex flex-column gap-7 gap-lg-10 w-100 w-lg-250px mb-7 me-lg-10">
                                        adf
                                    </div>
                                    <!--end::Table wrapper-->
                                    <div class="d-flex flex-column flex-row-fluid gap-7 gap-lg-10">
                                        <div class="fv-row">
                                            <label class="required form-label">Título</label>
                                            <input type="text" name="product_name" class="form-control mb-2" placeholder="Product name" value="">
                                        </div>
										<div class="row">
											<div class="col-md-6">
												<label class="form-label">Categoría</label>
												<ng-select
													[items]="categories_"
													bindLabel="name"
													bindValue="id"
													[(ngModel)]="categoriesSelected"
													placeholder="Buscar por categorías"
													[clearable]="false"
													[closeOnSelect]="false"
													class="select-categories"
													(change)="onSelectCategory()"
													[loading]="loadingCategories"
													[disabled]="loadingCategories"
													appendTo="body"
												>
													<!-- Opción en el dropdown -->
													<ng-template ng-option-tmp let-item="item">
														{{ item.name }}
													</ng-template>

													<!-- Opción seleccionada en el input -->
													<ng-template ng-label-tmp let-item="item">
														{{ item.name }}
													</ng-template>

													<ng-template ng-loading-text>
														<div class="spinner-container">
															<span class="spinner-border spinner-border-sm"></span>
														</div>
													</ng-template>
												</ng-select>
											</div>
											<div class="col-md-6">
												<label class="form-label">Subcategoría</label>
												<ng-select
													[items]="subcategories_"
													bindLabel="name"
													bindValue="id"
													[(ngModel)]="categoriesSelected"
													placeholder="Buscar por categorías"
													[clearable]="false"
													[closeOnSelect]="false"
													class="select-categories"
													(change)="onSelectCategory()"
													[loading]="loadingCategories"
													[disabled]="loadingCategories"
													appendTo="body"
												>
													<!-- Opción en el dropdown -->
													<ng-template ng-option-tmp let-item="item">
														{{ item.name }}
													</ng-template>

													<!-- Opción seleccionada en el input -->
													<ng-template ng-label-tmp let-item="item">
														{{ item.name }}
													</ng-template>

													<ng-template ng-loading-text>
														<div class="spinner-container">
															<span class="spinner-border spinner-border-sm"></span>
														</div>
													</ng-template>
												</ng-select>
											</div>
										</div>
										<div class="fv-row">
											<label class="required form-label">Contenido</label>
											<app-tinymce-editor [properties]="properties"></app-tinymce-editor>
										</div>
                                    </div>
                                </div>
								<!--begin::Table wrapper-->
							</div>

							<!--end::Card body-->
							<div class="card-footer">
								<a *ngIf="!loadBtn" class="btn btn-sm btn-primary my-1 cursor-pointer" (click)="create()"> Crear marca </a>
								<button *ngIf="loadBtn" class="btn btn-sm btn-primary my-1 cursor-pointer" type="button" disabled>
									<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
									<span role="status">Procesando...</span>
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
