<div class="modal fade" [id]="id" tabindex="-1" style="display: none" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered mw-500px">
		<div class="modal-content">
			<div class="modal-header pb-0 border-0 justify-content-end">
				<span class="svg-icon svg-icon-muted svg-icon-1 cursor-pointer" data-bs-dismiss="modal">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
						<rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
					</svg>
				</span>
			</div>
			<div class="modal-body mx-5 mx-xl-18 pt-0 pb-15" style="overflow-x: hidden !important">
				<div class="text-center mb-7 txt-body">
					<h2 class="mb-5">{{ title }}</h2>
					<div class="text-gray-600 fs-6" [innerHTML]="description"></div>
				</div>

				<div class="d-flex flex-center flex-row-fluid">
					<button type="reset" class="btn btn-light me-3" data-bs-dismiss="modal">Cancelar</button>

					<button
						*ngIf="!loadBtnDelete()"
						type="submit"
						class="btn"
						[ngClass]="{ 'btn-danger': textButton == 'Desactivar', 'btn-primary': textButton == 'Activar' }"
						(click)="onActionConfirmed()"
					>
						{{ textButton }}
					</button>
					<button
						[ngClass]="{ 'btn-danger': textButton == 'Desactivar', 'btn-primary': textButton == 'Activar' }"
						*ngIf="loadBtnDelete()"
						class="btn cursor-pointer"
						type="button"
						disabled
					>
						<span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
						<span role="status">Procesando...</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
