<div class="modal fade" [id]="id" tabindex="-1" style="display: none" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered mw-500px">
		<div class="modal-content">
			<div class="modal-header pb-0 border-0 justify-content-end">
				<span class="svg-icon svg-icon-muted svg-icon-1 cursor-pointer" data-bs-dismiss="modal">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
						<rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
					</svg>
				</span>
			</div>
			<div class="modal-body mx-5 mx-xl-18 pt-0 pb-15" style="overflow-x: hidden !important">
				<div class="text-center mb-7 txt-body">
					<h2 class="mb-5 fw-700">{{ title }}</h2>
					<div class="text-gray-600 fs-6 fw-400 my-1" [innerHTML]="description"></div>
				</div>

				<div class="d-flex flex-center flex-row-fluid">
					<button type="reset" 
					class="btn btn-sm btn-light-dark me-3 d-flex align-items-center justify-content-center gap-1 w-120px" 
					data-bs-dismiss="modal"
					>
						<span>Cancelar</span>
					</button>

					<button
						*ngIf="!loadBtnDelete()"
						type="submit"
						class="btn d-flex btn-sm align-items-center justify-content-center gap-1 w-120px"
						[ngClass]="{
							'btn-danger': textButton == 'Desactivar' || textButton == 'Eliminar',
							'btn-dark': textButton == 'Activar'
						}"
						(click)="onActionConfirmed()">
						<span>{{ textButton }}</span>
					</button>
					<button
						[ngClass]="{
							'btn-danger': textButton == 'Desactivar' || textButton == 'Eliminar',
							'btn-dark': textButton == 'Activar',
						}"
						*ngIf="loadBtnDelete()"
						class="btn d-flex btn-sm align-items-center justify-content-center gap-1 cursor-pointer w-120px"
						type="button"
						disabled
					>
						<span role="status">Procesando...</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
