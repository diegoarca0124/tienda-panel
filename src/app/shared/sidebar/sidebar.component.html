<div
	id="kt_app_sidebar"
	class="app-sidebar flex-column"
	data-kt-drawer="true"
	data-kt-drawer-name="app-sidebar"
	data-kt-drawer-activate="{default: true, lg: false}"
	data-kt-drawer-overlay="true"
	data-kt-drawer-width="225px"
	data-kt-drawer-direction="start"
	data-kt-drawer-toggle="#kt_app_sidebar_mobile_toggle"
>
	<div class="app-sidebar-logo px-6" id="kt_app_sidebar_logo" style="background-color: #151921 !important; border-bottom: 0px !important">
		<a class="text-white fs-1 ff-Lexend ls-1px fw-800 text-uppercase">
			
			<img alt="Logo" src="images/svg/tenant-blanco-transparente.svg" class="h-35px app-sidebar-logo-default" />
		</a>
		<div
			id="kt_app_sidebar_toggle"
			class="app-sidebar-toggle btn btn-icon btn-shadow btn-sm btn-color-muted btn-active-color-primary h-30px w-30px position-absolute top-50 start-100 translate-middle rotate"
			data-kt-toggle="true"
			data-kt-toggle-state="active"
			data-kt-toggle-target="body"
			data-kt-toggle-name="app-sidebar-minimize"
		>
			<i class="ki-duotone ki-right"></i>
		</div>
	</div>
	<div class="app-sidebar-menu overflow-hidden flex-column-fluid">
		<!--begin::Menu wrapper-->
		<div id="kt_app_sidebar_menu_wrapper" class="app-sidebar-wrapper">
			<!--begin::Scroll wrapper-->
			<div
				id="kt_app_sidebar_menu_scroll"
				class="scroll-y my-5 mx-3"
				data-kt-scroll="true"
				data-kt-scroll-activate="true"
				data-kt-scroll-height="auto"
				data-kt-scroll-dependencies="#kt_app_sidebar_logo, #kt_app_sidebar_footer"
				data-kt-scroll-wrappers="#kt_app_sidebar_menu"
				data-kt-scroll-offset="5px"
				data-kt-scroll-save-state="true"
			>
				<div
					class="menu menu-column menu-rounded menu-sub-indention fw-semibold fs-6"
					id="#kt_app_sidebar_menu"
					data-kt-menu="true"
					data-kt-menu-expand="false"
				>
					<div class="menu-item pt-5">
						<div class="menu-content">
							<span class="menu-heading fw-bold text-uppercase fs-7">Layouts</span>
						</div>
					</div>
					<div data-kt-menu-trigger="click" class="menu-item menu-accordion" [ngClass]="{ show: router.url.startsWith('/users') }">
						<span class="menu-link">
							<div class="menu-icon">
								<app-icon-users [classIcon]="'svg-icon-2'"></app-icon-users>
							</div>
							<span class="menu-title text-uppercase">Usuarios</span>
							<span class="menu-arrow"></span>
						</span>
						<div class="menu-sub menu-sub-accordion">
							<div class="menu-item">
								<a class="menu-link" [routerLink]="['/users/collaborators']" routerLinkActive="active">
									<span class="menu-bullet">
										<span class="bullet bullet-dot"></span>
									</span>
									<span class="menu-title">Colaboradores</span>
								</a>
							</div>
							<div class="menu-item">
								<a class="menu-link" [routerLink]="['/users/clients']" routerLinkActive="active">
									<span class="menu-bullet">
										<span class="bullet bullet-dot"></span>
									</span>
									<span class="menu-title">Clientes</span>
								</a>
							</div>
						</div>
					</div>

					<div class="menu-item pt-5">
						<div class="menu-content">
							<span class="menu-heading fw-bold text-uppercase fs-7">Productos</span>
						</div>
					</div>
					<div data-kt-menu-trigger="click" class="menu-item menu-accordion" [ngClass]="{ show: router.url.startsWith('/products') }">
						<span class="menu-link">
							<div class="menu-icon">
								<app-icon-inventory [classIcon]="'svg-icon-2'"></app-icon-inventory>
							</div>
							<span class="menu-title text-uppercase">Productos</span>
							<span class="menu-arrow"></span>
						</span>
						<div class="menu-sub menu-sub-accordion">
							<div class="menu-item">
								<a class="menu-link" [routerLink]="['/products/categories']" routerLinkActive="active">
									<span class="menu-bullet">
										<span class="bullet bullet-dot"></span>
									</span>
									<span class="menu-title">Categorías</span>
								</a>
							</div>
							<div class="menu-item">
								<a class="menu-link" [routerLink]="['/products/brands']" routerLinkActive="active">
									<span class="menu-bullet">
										<span class="bullet bullet-dot"></span>
									</span>
									<span class="menu-title">Marcas</span>
								</a>
							</div>
							<div class="menu-item">
								<a class="menu-link" [routerLink]="['/products/attributes/groups']" routerLinkActive="active">
									<span class="menu-bullet">
										<span class="bullet bullet-dot"></span>
									</span>
									<span class="menu-title">Atributos</span>
								</a>
							</div>
							<div class="menu-item">
								<a class="menu-link" [routerLink]="['/products/articles']" routerLinkActive="active">
									<span class="menu-bullet">
										<span class="bullet bullet-dot"></span>
									</span>
									<span class="menu-title">Articulos</span>
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div class="app-sidebar-footer flex-column-auto pt-2 pb-6 px-6" id="kt_app_sidebar_footer">
		<a
			href="https://preview.keenthemes.com/html/metronic/docs"
			class="btn btn-flex flex-center btn-custom btn-primary overflow-hidden text-nowrap px-0 h-40px w-100"
			data-bs-toggle="tooltip"
			data-bs-trigger="hover"
			data-bs-dismiss-="click"
			title="200+ in-house components and 3rd-party plugins"
		>
			<span class="btn-label">Documentación</span>
			<i class="ki-duotone ki-document btn-icon fs-2 m-0">
				<span class="path1"></span>
				<span class="path2"></span>
			</i>
		</a>
	</div>
</div>
