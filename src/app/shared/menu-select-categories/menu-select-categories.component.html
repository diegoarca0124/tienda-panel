<div class="dropdown w-100">
  <input 
    #trigger
    type="text" 
    name="name"
    class="form-select dropdown-toggle w-100 text-ellipsis cursor-pointer"
    [ngClass]="{'form-select-sm': sizeClass == 'sm'}"
    data-bs-toggle="dropdown"
    aria-expanded="false"
    [value]="selectedNames"
    [placeholder]="placeholder"
    placement="top" 
    [ngbTooltip]="selectedNames"
    tooltipClass="tooltip-dark"
  />

  <div id="dropdown" class="dropdown-menu w-100" data-bs-display="static"
  data-bs-auto-close="outside"  (click)="$event.stopPropagation()">
    <div class="d-flex flex-column p-5 border-bottom gap-3">
        <div class="d-flex justify-content-between mb-1">
            <div class="d-flex flex-column">
                <span class="fw-600 text-gray-800 fw-bold fs-5">{{title}}</span>
            </div>
            <small class="text-primary cursor-pointer d-flex align-items-center gap-1" (click)="init_categories()">
                <i class="bi bi-arrow-clockwise text-primary"></i>
                Recargar 
            </small>
        </div>

        <div class="position-relative">
            <!-- Input con padding extra a la derecha -->
            <input
                type="text"
                class="form-control form-control-sm pe-5" 
                [placeholder]="placeholder"
                name="filter"
                [(ngModel)]="filter"
                (keyup)="onFilterOrStatusChange()"
            />

            <!-- Icono dentro del input -->
            <i 
                class="bi bi-search position-absolute top-50 translate-middle-y cursor-pointer"
                style="right: 12px"
                (click)="onFilterOrStatusChange()"
            ></i>
        </div>
    </div>
    

    <div class="d-flex flex-column p-5 border-bottom items-container" [ngClass]="{'align-items-center justify-content-center': displayCategories.length == 0}">
        <ng-container *ngIf="!loadingCategories">
            <ng-container *ngIf="displayCategories.length >= 1">
                <ng-container *ngFor="let item of displayCategories; let lst = last">
                    <div class="w-100">
                        <label class="form-check form-check-custom form-check-solid">
                            <input class="form-check-input h-20px w-20px" type="checkbox" [(ngModel)]="item.checked" [checked]="item.checked" (change)="onApplyCategories()">
                            <small class="form-check-label text-gray-700">
                                {{item.name}}
                            </small>
                        </label>
                        <div *ngIf="!lst" class="separator separator-dashed my-2"></div>
                    </div>
                </ng-container> 
            </ng-container>
            <ng-container *ngIf="displayCategories.length == 0">
                <div class="fw-semibold text-gray-500">
                    No se encontraron resultados.
                </div>
            </ng-container>
        </ng-container>
        <ng-container *ngIf="loadingCategories">
            <div class="d-flex flex-column">
                <div class="d-flex gap-3 align-items-center">
                    <div class="form-control-solid form-control-load"
                        style="height: 20px; width: 20px; border-radius: 5px"
                    ></div>
                    <div class="form-control-solid form-control-load"
                        style="height: 13px; width: 100%; border-radius: 5px"
                    ></div>
                </div>
                 <div class="separator separator-dashed my-2"></div>
                <div class="d-flex gap-3 align-items-center">
                    <div class="form-control-solid form-control-load"
                        style="height: 20px; width: 20px; border-radius: 5px"
                    ></div>
                    <div class="form-control-solid form-control-load"
                        style="height: 13px; width: 100%; border-radius: 5px"
                    ></div>
                </div>
                 <div class="separator separator-dashed my-2"></div>
                <div class="d-flex gap-3 align-items-center">
                    <div class="form-control-solid form-control-load"
                        style="height: 20px; width: 20px; border-radius: 5px"
                    ></div>
                    <div class="form-control-solid form-control-load"
                        style="height: 13px; width: 100%; border-radius: 5px"
                    ></div>
                </div>
            </div>
        </ng-container>
    </div>

    <div class="p-2">
        <div class="col-12 d-flex justify-content-end gap-2">
            <button class="btn btn-sm text-primary" (click)="onRemoveCategories()">Limpiar</button>
            <button class="btn btn-sm btn-secondary" (click)="closeMenu()">
                Cerrar
            </button>
        </div>
    </div>
  </div>
</div>
