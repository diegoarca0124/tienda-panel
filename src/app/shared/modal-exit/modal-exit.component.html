<div class="modal fade" id="modal-exit" tabindex="-1" aria-hidden="true" style="display: none">
	<div class="modal-dialog modal-dialog-centered mw-500px">
		<div class="modal-content">
			<div class="modal-header pb-0 border-0 justify-content-end">
				<span class="svg-icon svg-icon-muted svg-icon-1 cursor-pointer" data-bs-dismiss="modal" (click)="cancelExit()">
					<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
						<rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
						<rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
					</svg>
				</span>
			</div>
			<div class="modal-body mx-5 mx-xl-18 pt-0 pb-15" style="overflow-x: hidden">
				<div class="text-center mb-7">
					<h3 class="mb-5 text-uppercase fw-bold">¿Salir sin guardar?</h3>
					<div class="text-gray-600 fs-6">
						<b>Tienes cambios pendientes</b>
						. Si abandonas esta página perderás la información no guardada.
					</div>
				</div>
				<div class="row g-3">
					<div class="col">
						<button type="button" class="btn btn-sm btn-light-dark w-100" (click)="cancelExit()">Permanecer</button>
					</div>

					<div class="col">
						<button type="button" class="btn btn-sm btn-dark w-100" (click)="confirmExit()">Salir</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
