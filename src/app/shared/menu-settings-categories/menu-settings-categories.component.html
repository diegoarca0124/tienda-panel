<div class="dropdown action-dropdown settings-dropdown">
	<button
		#trigger
		type="button"
		class="form-control settings-trigger dropdown-toggle dropdown-toggle-no-arrow text-gray-700 fw-500"
		[ngClass]="sizeClass === 'sm' ? 'form-control-sm' : 'form-control-md'"
		data-bs-toggle="dropdown"
		data-bs-auto-close="outside"
		data-bs-offset="0,8"
		aria-haspopup="true"
		aria-expanded="false"
		[attr.aria-label]="title"
		[ngbTooltip]="selectedItems.length ? getSelectedNames() : null"
		placement="top"
		tooltipClass="tooltip-dark"
	>
		<span class="text-truncate" [class.placeholder-text]="!selectedItems.length">
			{{ selectedItems.length ? getSelectedNames() : placeholder }}
		</span>

		<span class="d-inline-flex align-items-center gap-2 flex-shrink-0">
			@if (selectedItems.length) {
				<span class="badge rounded-pill bg-light-primary text-primary fw-700" aria-label="Configuraciones seleccionadas">
					{{ selectedItems.length }}
				</span>
			}

			<ion-icon style="font-size: 1.1rem" name="chevron-down-outline" class="app-btn-chevron text-gray-500" aria-hidden="true"></ion-icon>
		</span>
	</button>

	<div class="dropdown-menu dropdown-menu-end action-dropdown-menu settings-menu p-0" (click)="$event.stopPropagation()">
		<header class="form-card-header d-flex align-items-start justify-content-between gap-3">
			<div>
				<h3 class="form-card-title fs-15">
					{{ title }}
				</h3>

				<p class="form-card-description fs-12">Elige los datos que deseas solicitar para los productos de esta categoría.</p>
			</div>

			<span class="badge rounded-pill bg-light-primary text-primary fw-700 flex-shrink-0">{{ selectedItems.length }}/{{ displayData.length }}</span>
		</header>

		<div class="settings-list" role="group" [attr.aria-label]="title">
			<label class="form-check form-check-customs form-check-sm action-dropdown-item settings-option m-0" *ngFor="let item of displayData">
				<input class="form-check-input flex-shrink-0" type="checkbox" [(ngModel)]="item.checked" />

				<span class="action-dropdown-item-content">
					<span class="action-dropdown-item-title">
						{{ item.name }}
					</span>

					<span class="action-dropdown-item-description">
						{{ item.description }}
					</span>
				</span>
			</label>
		</div>

		<footer class="form-card-footer d-flex align-items-center justify-content-end gap-2">
			<button type="button" class="btn btn-sm btn-light" [disabled]="!selectedItems.length" (click)="clearSelection()">Limpiar</button>

			<button type="button" class="btn btn-sm btn-primary" (click)="confirmSelection()">Aplicar filtros</button>
		</footer>
	</div>
</div>
