<div class="position-relative">
	<button type="button" class="btn btn-icon btn-active-color-gray-700 position-absolute translate-middle-y top-50 start-0" (click)="decrement()" [disabled]="disabled">
		<i class="bi bi-dash fs-1 icon-round" style="font-size: 1.3rem !important"></i>
	</button>

	<input
		type="text"
		class="form-control form-control-sm"
		style="text-align: center"
		[placeholder]="placeholder"
		[ngModel]="inputValue"
		(ngModelChange)="onInput($event)"
		[disabled]="disabled"
	/>

	<button type="button" class="btn btn-icon btn-active-color-gray-700 position-absolute translate-middle-y top-50 end-0" (click)="increment()" [disabled]="disabled">
		<i class="bi bi-plus icon-round" style="font-size: 1.3rem !important"></i>
	</button>
</div>
